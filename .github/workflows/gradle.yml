  name: Chat API Server CI/CD

  on:
    pull_request:
      branches:
        - main
        - dev

    push:
      branches:
        - main
        - dev

  jobs:
    test:
      name: Test and JaCoCo
      runs-on: ubuntu-latest

      steps:
        # 1. 소스 체크아웃
        - name: Checkout source code
          uses: actions/checkout@v4

        # 2. JDK 21 세팅
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: gradle

        # 3. Gradle 환경 준비
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4

        # 4. gradlew 실행 권한 부여
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew

        # 5. 테스트 실행 및 JaCoCo 리포트 생성
        - name: Run tests and generate JaCoCo report
          run: ./gradlew clean test jacocoTestReport jacocoTestCoverageVerification

        # 6. 테스트 리포트 업로드
        - name: Upload test report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-report
            path: build/reports/tests/test

        # 7. JaCoCo 리포트 업로드
        - name: Upload JaCoCo report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: jacoco-report
            path: build/reports/jacoco/test/html

        - name: Verify JaCoCo report exists
          run: |
            test -f build/reports/jacoco/test/html/index.html
            test -f build/reports/jacoco/test/jacocoTestReport.xml

    build-check:
      name: Build Check
      runs-on: ubuntu-latest
      needs: test

      steps:
        # 1. 소스 체크아웃
        - name: Checkout source code
          uses: actions/checkout@v4

        # 2. JDK 21 세팅
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: gradle

        # 3. Gradle 환경 준비
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4

        # 4. gradlew 실행 권한 부여
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew

        # 5. JAR 빌드 가능 여부 확인
        # 테스트는 test job에서 이미 실행했으므로 여기서는 빌드만 확인
        - name: Build jar
          run: ./gradlew clean build -x test

        # 6. build/libs 산출물 확인
        - name: Verify jar artifact exists
          run: |
            ls -al build/libs
            test -n "$(find build/libs -name '*.jar' -type f)"

    build-and-deploy:
      name: Build and Deploy
      runs-on: ubuntu-latest
      needs:
        - test
        - build-check

      # PR에서는 배포하지 않고, main/dev push일 때만 배포
      if: github.event_name == 'push'

      steps:
        # 1. 소스 체크아웃
        - name: Checkout source code
          uses: actions/checkout@v4

        # 2. JDK 21 세팅
        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: gradle

        # 3. Gradle 환경 준비
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4

        # 4. gradlew 실행 권한 부여
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew

        # 5. JAR 빌드
        # 테스트는 test job에서 이미 통과했으므로 배포용 빌드는 테스트 제외
        - name: Build with Gradle
          run: ./gradlew clean build -x test

        # 6. Docker Hub 로그인
        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        # 7. Docker 이미지 빌드 & 푸시
        - name: Build and Push Docker Image
          run: |
            IMAGE_NAME=${{ secrets.DOCKER_REPO }}
            IMAGE_TAG=${{ github.sha }}
            
            docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
            
            docker push $IMAGE_NAME:$IMAGE_TAG
            docker push $IMAGE_NAME:latest

        # 8. 서버에 SSH 접속해서 컨테이너 실행
        - name: Deploy to Server
          uses: appleboy/ssh-action@v0.1.10
          with:
            host: ${{ secrets.SSH_IP }}
            username: ${{ secrets.SSH_ID }}
            key: ${{ secrets.SSH_KEY }}
            port: ${{ secrets.SSH_PORT }}
            script: |
              cd ~/chat_server
              ./api_server_startup.sh
