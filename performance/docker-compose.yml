services:
  mysql:
    image: mysql:8.0.39
    container_name: chatalk-perf-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --performance-schema=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${PERF_DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${PERF_DB_NAME:-chat_server_perf}
      TZ: Asia/Seoul
    ports:
      - "${PERF_DB_PORT:-3307}:3306"
    volumes:
      - chatalk_perf_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${PERF_DB_PASSWORD:-1234}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: chatalk-perf-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${PERF_REDIS_PORT:-6380}:6379"
    volumes:
      - chatalk_perf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: chatalk-perf-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PERF_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - chatalk_perf_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.2
    container_name: chatalk-perf-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${PERF_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - chatalk_perf_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    working_dir: /scripts
    volumes:
      - ../scripts/performance/k6:/scripts:ro
      - ./results:/results
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  chatalk_perf_mysql_data:
  chatalk_perf_redis_data:
  chatalk_perf_prometheus_data:
  chatalk_perf_grafana_data:
