spring:
  application:
    name: chat_server
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    group:
      dev:
        - custom
        - web
      prod:
        - custom
        - web


server:
  port: 7070
  tomcat:
    uri-encoding: UTF-8
    max-swallow-size: -1

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: info


file:
  upload:
    profile-dir: /app/uploads/profile
    chat-image-dir: /app/uploads/chat/images
    chat-file-dir: /app/uploads/chat/files
